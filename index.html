<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFS League Phase Draw</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 30px 20px 60px;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 36px;
    letter-spacing: -0.5px;
}

.subtitle {
    text-align: center;
    color: #999999;
    margin-top: 8px;
    margin-bottom: 25px;
}

/* TABS */

.tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 25px;
}

.tab-button {
    background: #111111;
    color: #888888;
    border: 1px solid #2b2b2b;
    border-radius: 7px;
    padding: 12px 25px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}

.tab-button:hover {
    background: #1a1a1a;
    color: #ffffff;
}

.tab-button.active {
    background: #ffffff;
    color: #050505;
    border-color: #ffffff;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

button {
    border: 1px solid #444444;
    border-radius: 7px;
    padding: 13px 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
    background: #ffffff;
    color: #050505;
}

button:hover {
    transform: translateY(-2px);
    background: #dddddd;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
}

#resetBtn {
    background: #111111;
    color: #ffffff;
    border-color: #444444;
}

/* TABS CONTENT */

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* SELECTED TEAM */

.selected-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 38px;
    margin-bottom: 25px;
}

.selected-label {
    color: #777777;
}

.selected-name {
    color: #ffffff;
    font-size: 22px;
    font-weight: bold;
}

/* POTS */

.pots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.pot {
    background: #0d0d0d;
    border: 1px solid #2b2b2b;
    border-radius: 10px;
    padding: 15px;
}

.pot-title {
    text-align: center;
    color: #ffffff;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #111111;
    border: 1px solid #1f1f1f;
    border-radius: 7px;
    padding: 8px 9px;
    margin-bottom: 7px;
    cursor: pointer;
    transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.15s;
}

.team:hover {
    background: #1a1a1a;
    border-color: #444444;
    transform: translateX(2px);
}

.team.selected {
    background: #1d1d1d;
    border-color: #ffffff;
}

.team-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    flex-shrink: 0;
}

.team-logo-fallback {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #ffffff;
    flex-shrink: 0;
}

.team-name {
    font-size: 14px;
    font-weight: bold;
    flex: 1;
    line-height: 1.2;
}

.division {
    color: #ffffff;
    background: #222222;
    border: 1px solid #444444;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
}

/* DRAW RESULT */

.result {
    display: none;
    max-width: 850px;
    margin: 38px auto 0;
    scroll-margin-top: 30px;
}

.result-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
}

.result-subtitle {
    text-align: center;
    color: #888888;
    margin-top: 5px;
    margin-bottom: 15px;
}

.draw-status {
    text-align: center;
    color: #888888;
    font-size: 14px;
    margin: 10px 0 20px;
    min-height: 20px;
    transition: color 0.3s ease;
}

.draw-status.active {
    color: #ffffff;
}

.draw-status.finished {
    color: #ffffff;
    font-weight: bold;
}

.fixtures {
    display: grid;
    gap: 8px;
}

.fixture {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #101010;
    border: 1px solid #2b2b2b;
    border-radius: 8px;
    padding: 12px 15px;
    scroll-margin-top: 80px;
}

.fixture.revealing {
    animation:
        uefaFixtureReveal
        0.65s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
}

@keyframes uefaFixtureReveal {
    0% {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
        filter: blur(3px);
    }

    55% {
        opacity: 1;
        transform: translateY(-1px) scale(1.01);
        filter: blur(0);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes resultHeaderAppear {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fixture-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.fixture-left .opponent {
    min-width: 0;
    white-space: nowrap;
}

.match-number {
    width: 22px;
    color: #555555;
    font-size: 13px;
}

.opponent-logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.opponent {
    font-size: 16px;
    font-weight: bold;
}

.opponent-division {
    color: #ffffff;
    background: #222222;
    border: 1px solid #444444;
    border-radius: 4px;
    padding: 4px 7px;
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
}

.right-side {
    display: flex;
    align-items: center;
    gap: 10px;
}

.pot-label {
    color: #666666;
    font-size: 12px;
}

.location {
    min-width: 60px;
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    padding: 6px 8px;
    border-radius: 5px;
}

.home {
    color: #7CFF9B;
    background: rgba(35, 150, 70, 0.20);
    border: 1px solid #2f8f4e;
}

.away {
    color: #ff7777;
    background: rgba(180, 35, 35, 0.20);
    border: 1px solid #a33a3a;
}

.info {
    text-align: center;
    color: #777777;
    font-size: 13px;
    margin-top: 18px;
}

/* =========================================
   FIXTURES TAB - ACCORDION
========================================= */

.fixture-teams {
    display: grid;
    gap: 8px;
    max-width: 850px;
    margin: 0 auto 25px;
}

.fixture-team {
    width: 100%;
    background: #101010;
    border: 1px solid #2b2b2b;
    border-radius: 9px;
    overflow: hidden;
    transition:
        background 0.15s,
        border-color 0.15s;
}

.fixture-team:hover {
    border-color: #555555;
}

.fixture-team.open {
    border-color: #ffffff;
    background: #101010;
}

/* CLICKABLE TEAM HEADER */

.fixture-team-header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 15px;
    cursor: pointer;
    user-select: none;
}

.fixture-team-header:hover {
    background: #181818;
}

.fixture-team-logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.fixture-team-name {
    font-size: 16px;
    font-weight: bold;
    flex: 1;
    text-align: left;
}

.fixture-team-count {
    color: #777777;
    font-size: 12px;
    white-space: nowrap;
}

.fixture-team-arrow {
    width: 20px;
    color: #777777;
    font-size: 15px;
    text-align: center;
    transition: transform 0.2s ease;
}

.fixture-team.open .fixture-team-arrow {
    transform: rotate(180deg);
    color: #ffffff;
}

/* FIXTURES UNDER THE TEAM */

.fixture-team-details {
    display: none;
    padding: 0 10px 10px;
    border-top: 1px solid #252525;
}

.fixture-team.open .fixture-team-details {
    display: block;
}

/* MATCH CARD */

.match-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #101010;
    border: 1px solid #2b2b2b;
    border-radius: 9px;
    padding: 12px 16px;
    margin-top: 8px;
    min-height: 72px;
}

.match-team {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    width: auto;
}

.match-team.home-team {
    justify-content: flex-end;
    text-align: right;
}

.match-team.away-team {
    justify-content: flex-start;
    text-align: left;
}

.match-team img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.match-team span {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
}

.vs {
    color: #777777;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
    margin: 0 2px;
    white-space: nowrap;
}

.empty-fixtures {
    text-align: center;
    color: #666666;
    background: #0d0d0d;
    border: 1px solid #222222;
    border-radius: 10px;
    padding: 35px 20px;
}

.fixtures-header {
    text-align: center;
    margin-bottom: 18px;
}

.fixtures-header h2 {
    margin: 0;
    font-size: 28px;
}

.fixtures-header p {
    color: #777777;
    margin: 7px 0 0;
}

/* MOBILE */

@media (max-width: 900px) {

    .pots {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 550px) {

    .container {
        padding: 20px 10px 40px;
    }

    h1 {
        font-size: 27px;
    }

    .pots {
        grid-template-columns: 1fr;
    }

    .opponent {
        font-size: 14px;
    }

    .opponent-division {
        font-size: 9px;
    }

    .division {
        font-size: 9px;
    }

    .right-side {
        gap: 6px;
    }

    .pot-label {
        display: none;
    }

    .fixture-team-header {
        padding: 11px 10px;
        gap: 9px;
    }

    .fixture-team-logo {
        width: 32px;
        height: 32px;
    }

    .fixture-team-name {
        font-size: 14px;
    }

    .fixture-team-count {
        font-size: 10px;
    }

    .fixture-team-arrow {
        width: 16px;
        font-size: 13px;
    }

    .fixture-team-details {
        padding: 0 6px 6px;
    }

    .match-card {
        gap: 6px;
        padding: 10px 6px;
    }

    .match-team {
        gap: 6px;
    }

    .match-team span {
        font-size: 11px;
        white-space: normal;
    }

    .match-team img {
        width: 30px;
        height: 30px;
    }

    .vs {
        font-size: 10px;
        margin: 0;
    }

}

</head>

<body>

<div class="container">

    <h1>tfs league phase draw</h1>

    <div class="subtitle">
        select a team and draw its league-phase opponents
    </div>

    <!-- TABS -->

    <div class="tabs">

        <button
            id="drawTabBtn"
            class="tab-button active"
            onclick="switchTab('draw')"
        >
            DRAW
        </button>

        <button
            id="fixturesTabBtn"
            class="tab-button"
            onclick="switchTab('fixtures')"
        >
            FIXTURES
        </button>

    </div>

    <!-- DRAW TAB -->

    <div
        id="drawTab"
        class="tab-content active"
    >

        <div class="controls">

            <button id="drawBtn">
                DRAW OPPONENTS
            </button>

            <button id="resetBtn">
                NEW DRAW
            </button>

        </div>

        <div class="selected-box">

            <span class="selected-label">
                Selected team:
            </span>

            <span
                id="selectedName"
                class="selected-name"
            >
                None
            </span>

        </div>

        <div
            id="pots"
            class="pots"
        ></div>

        <div
            id="result"
            class="result"
        ></div>

    </div>

    <!-- FIXTURES TAB -->

    <div
        id="fixturesTab"
        class="tab-content"
    >

        <div class="fixtures-header">

            <h2>Fixtures</h2>

            <p>
                Click a team to open or close its revealed fixtures
            </p>

        </div>

        <div
            id="drawnTeams"
            class="fixture-teams"
        ></div>

    </div>

</div>

/* =========================
   STATE
========================= */

let teams = [];

let selectedTeam = null;

let drawGenerated = false;

let drawInProgress = false;

let revealedFixtures = new Map();

let activeFixtureTeam = null;


/* =========================
   TEAM CREATION
========================= */

function createTeams() {

    teams = [];

    for (let pot = 0; pot < 4; pot++) {

        for (let index = 0; index < 8; index++) {

            const data = pots[pot][index];

            teams.push({

                name: data.name,

                logo: data.logo,

                division: data.division,

                color:
                    CLUB_COLORS[data.name] ||
                    "#ffffff",

                pot: pot,

                index: index,

                fixtures: []

            });

        }

    }

}


/* =========================
   HELPERS
========================= */

function shuffle(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];

    }

    return result;

}


function findTeam(pot, index) {

    return teams.find(
        team =>
            team.pot === pot &&
            team.index === index
    );

}


function getTeamId(team) {

    return `${team.pot}-${team.index}`;

}


function getInitials(name) {

    return name
        .split(" ")
        .filter(word => word.length > 0)
        .slice(0, 2)
        .map(word => word[0].toUpperCase())
        .join("");

}


function wait(milliseconds) {

    return new Promise(
        resolve =>
            setTimeout(resolve, milliseconds)
    );

}


/* =========================
   FIXTURE GENERATION
========================= */

function addFixture(
    teamA,
    teamB,
    homeTeam
) {

    const aIsHome =
        homeTeam === teamA;

    teamA.fixtures.push({

        opponent: teamB.name,

        opponentLogo: teamB.logo,

        opponentPot: teamB.pot,

        opponentDivision: teamB.division,

        opponentColor: teamB.color,

        home: aIsHome

    });

    teamB.fixtures.push({

        opponent: teamA.name,

        opponentLogo: teamA.logo,

        opponentPot: teamA.pot,

        opponentDivision: teamA.division,

        opponentColor: teamA.color,

        home: !aIsHome

    });

}


function createSamePotDraw(potNumber) {

    const order =
        shuffle([
            0, 1, 2, 3,
            4, 5, 6, 7
        ]);

    for (let i = 0; i < 8; i++) {

        const current =
            findTeam(
                potNumber,
                order[i]
            );

        const next =
            findTeam(
                potNumber,
                order[(i + 1) % 8]
            );

        addFixture(
            current,
            next,
            current
        );

    }

}


function createCrossPotDraw(
    potA,
    potB
) {

    let first;

    let second;

    do {

        first =
            shuffle([
                0, 1, 2, 3,
                4, 5, 6, 7
            ]);

        second =
            shuffle([
                0, 1, 2, 3,
                4, 5, 6, 7
            ]);

    } while (

        first.some(
            (value, index) =>
                value === second[index]
        )

    );

    for (let i = 0; i < 8; i++) {

        const teamA =
            findTeam(
                potA,
                i
            );

        const teamB =
            findTeam(
                potB,
                first[i]
            );

        addFixture(
            teamA,
            teamB,
            teamA
        );

    }

    for (let i = 0; i < 8; i++) {

        const teamA =
            findTeam(
                potA,
                i
            );

        const teamB =
            findTeam(
                potB,
                second[i]
            );

        addFixture(
            teamA,
            teamB,
            teamB
        );

    }

}


/* =========================
   VALIDATION
========================= */

function validateDraw() {

    for (const team of teams) {

        const counts = [0, 0, 0, 0];

        const opponents = new Set();

        for (const fixture of team.fixtures) {

            counts[fixture.opponentPot]++;

            if (
                opponents.has(
                    fixture.opponent
                )
            ) {

                return false;

            }

            opponents.add(
                fixture.opponent
            );

        }

        if (
            counts[0] !== 2 ||
            counts[1] !== 2 ||
            counts[2] !== 2 ||
            counts[3] !== 2
        ) {

            return false;

        }

        if (team.fixtures.length !== 8) {

            return false;

        }

        const homeCount =
            team.fixtures.filter(
                fixture => fixture.home
            ).length;

        const awayCount =
            team.fixtures.filter(
                fixture => !fixture.home
            ).length;

        if (
            homeCount !== 4 ||
            awayCount !== 4
        ) {

            return false;

        }

    }

    return true;

}


function generateDraw() {

    let attempts = 0;

    do {

        createTeams();

        for (let pot = 0; pot < 4; pot++) {

            createSamePotDraw(pot);

        }

        for (let a = 0; a < 4; a++) {

            for (let b = a + 1; b < 4; b++) {

                createCrossPotDraw(
                    a,
                    b
                );

            }

        }

        attempts++;

    } while (
        !validateDraw() &&
        attempts < 1000
    );

    if (!validateDraw()) {

        console.error(
            "Draw generation failed.",
            teams
        );

        drawGenerated = false;

        return false;

    }

    drawGenerated = true;

    return true;

}


/* =========================
   REVEAL FIXTURES
========================= */

function addRevealedFixture(
    team,
    fixture
) {

    const teamId =
        getTeamId(team);

    if (!revealedFixtures.has(teamId)) {

        revealedFixtures.set(
            teamId,
            []
        );

    }

    const existing =
        revealedFixtures.get(teamId);

    const alreadyExists =
        existing.some(
            item =>
                item.opponent === fixture.opponent &&
                item.home === fixture.home
        );

    if (!alreadyExists) {

        existing.push({
            ...fixture
        });

    }

}


function revealTeamFixtures(team) {

    for (const fixture of team.fixtures) {

        /*
            The selected team sees all 8
            of its own fixtures.
        */

        addRevealedFixture(
            team,
            fixture
        );


        /*
            The opponent only sees the one
            fixture involving the selected team.
        */

        const opponent =
            teams.find(
                item =>
                    item.name ===
                    fixture.opponent
            );

        if (!opponent) {
            continue;
        }

        addRevealedFixture(
            opponent,
            {

                opponent: team.name,

                opponentLogo: team.logo,

                opponentPot: team.pot,

                opponentDivision: team.division,

                opponentColor: team.color,

                home: !fixture.home

            }
        );

    }

}


/* =========================
   BUILD TEAM LIST
========================= */

function buildTeamList() {

    const container =
        document.getElementById("pots");

    container.innerHTML = "";

    for (let pot = 0; pot < 4; pot++) {

        const potDiv =
            document.createElement("div");

        potDiv.className = "pot";

        const title =
            document.createElement("div");

        title.className = "pot-title";

        title.textContent =
            `POT ${pot + 1}`;

        potDiv.appendChild(title);

        pots[pot].forEach(
            (teamData, index) => {

                const teamButton =
                    document.createElement("div");

                teamButton.className = "team";

                teamButton.dataset.pot = pot;

                teamButton.dataset.index = index;

                const logo =
                    document.createElement("img");

                logo.className = "team-logo";

                logo.src = teamData.logo;

                logo.alt = teamData.name;

                logo.onerror = function () {

                    const fallback =
                        document.createElement("div");

                    fallback.className =
                        "team-logo-fallback";

                    fallback.textContent =
                        getInitials(
                            teamData.name
                        );

                    this.replaceWith(
                        fallback
                    );

                };

                teamButton.appendChild(logo);

                const name =
                    document.createElement("span");

                name.className = "team-name";

                name.textContent =
                    teamData.name;

                name.style.color =
                    CLUB_COLORS[
                        teamData.name
                    ] || "#ffffff";

                teamButton.appendChild(name);

                const division =
                    document.createElement("span");

                division.className = "division";

                division.textContent =
                    teamData.division;

                teamButton.appendChild(division);

                teamButton.addEventListener(
                    "click",
                    function () {

                        if (drawInProgress) {
                            return;
                        }

                        selectTeam(
                            pot,
                            index
                        );

                    }
                );

                potDiv.appendChild(
                    teamButton
                );

            }
        );

        container.appendChild(
            potDiv
        );

    }

}


/* =========================
   SELECT TEAM
========================= */

function selectTeam(
    pot,
    index
) {

    selectedTeam =
        findTeam(
            pot,
            index
        );

    if (!selectedTeam) {
        return;
    }

    document
        .querySelectorAll(".team")
        .forEach(element => {

            element.classList.remove(
                "selected"
            );

        });

    const selectedElement =
        document.querySelector(
            `.team[data-pot="${pot}"][data-index="${index}"]`
        );

    if (selectedElement) {

        selectedElement.classList.add(
            "selected"
        );

    }

    const selectedName =
        document.getElementById(
            "selectedName"
        );

    selectedName.textContent =
        selectedTeam.name;

    selectedName.style.color =
        CLUB_COLORS[
            selectedTeam.name
        ] || "#ffffff";

    document.getElementById(
        "result"
    ).style.display = "none";

}


/* =========================
   DRAW SELECTED TEAM
========================= */

async function drawSelectedTeam() {

    if (drawInProgress) {
        return;
    }

    if (!selectedTeam) {

        alert(
            "Please select a team first."
        );

        return;

    }

    drawInProgress = true;

    const drawButton =
        document.getElementById(
            "drawBtn"
        );

    drawButton.disabled = true;


    if (!drawGenerated) {

        const success =
            generateDraw();

        if (!success) {

            const result =
                document.getElementById(
                    "result"
                );

            result.innerHTML = `

                <div class="result-title">
                    Draw Error
                </div>

                <div class="result-subtitle">
                    Unable to generate a valid
                    8-opponent draw.
                </div>

            `;

            result.style.display = "block";

            drawInProgress = false;

            drawButton.disabled = false;

            return;

        }

    }


    selectedTeam =
        findTeam(
            selectedTeam.pot,
            selectedTeam.index
        );


    await showOpponents();


    /*
        Reveal the selected team's 8 fixtures
        and one reciprocal fixture to every
        opponent.
    */

    revealTeamFixtures(
        selectedTeam
    );

    updateFixturesTab();


    drawInProgress = false;

    drawButton.disabled = false;

}


/* =========================
   SHOW OPPONENTS
========================= */

async function showOpponents() {

    const result =
        document.getElementById(
            "result"
        );

    const byPot = {

        0: [],
        1: [],
        2: [],
        3: []

    };

    selectedTeam.fixtures.forEach(
        fixture => {

            byPot[
                fixture.opponentPot
            ].push(fixture);

        }
    );

    const orderedFixtures = [];

    for (let pot = 0; pot < 4; pot++) {

        const fixtures =
            byPot[pot];

        const homes =
            fixtures.filter(
                fixture =>
                    fixture.home === true
            );

        const aways =
            fixtures.filter(
                fixture =>
                    fixture.home === false
            );

        if (
            homes.length !== 1 ||
            aways.length !== 1
        ) {

            result.innerHTML = `

                <div class="result-title">
                    Draw Error
                </div>

                <div class="result-subtitle">
                    Pot ${pot + 1} did not contain
                    exactly 2 opponents.
                </div>

            `;

            result.style.display = "block";

            return;

        }

        orderedFixtures.push({

            ...homes[0],

            displayPot: pot

        });

        orderedFixtures.push({

            ...aways[0],

            displayPot: pot

        });

    }


    result.innerHTML = `

        <div
            class="result-title"
            style="
                animation:
                    resultHeaderAppear
                    0.65s
                    ease-out
                    both;
                color:
                    ${
                        CLUB_COLORS[
                            selectedTeam.name
                        ] || "#ffffff"
                    };
            "
        >
            ${selectedTeam.name}
        </div>

        <div class="result-subtitle">
            League Phase Opponents
        </div>

        <div
            id="drawStatus"
            class="draw-status active"
        >
            Preparing the draw...
        </div>

        <div
            id="liveFixtures"
            class="fixtures"
        ></div>

    `;

    result.style.display = "block";

    requestAnimationFrame(() => {

        result.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    });

    await wait(700);


    for (let pot = 0; pot < 4; pot++) {

        const status =
            document.getElementById(
                "drawStatus"
            );

        const potFixtures =
            orderedFixtures.filter(
                fixture =>
                    fixture.displayPot === pot
            );

        status.textContent =
            `Drawing Pot ${pot + 1}`;

        await wait(400);


        for (
            let i = 0;
            i < potFixtures.length;
            i++
        ) {

            const fixture =
                potFixtures[i];

            status.textContent =
                `Pot ${pot + 1} • ${
                    fixture.home
                        ? "HOME"
                        : "AWAY"
                } opponent`;

            await wait(300);

            const liveFixtures =
                document.getElementById(
                    "liveFixtures"
                );

            const fixtureElement =
                document.createElement(
                    "div"
                );

            fixtureElement.className =
                "fixture revealing";

            fixtureElement.innerHTML = `

                <div class="fixture-left">

                    <span class="match-number">
                        ${
                            liveFixtures
                                .children
                                .length + 1
                        }
                    </span>

                    <img
                        class="opponent-logo"
                        src="${fixture.opponentLogo}"
                        alt="${fixture.opponent}"
                        onerror="
                            this.style.display='none';
                        "
                    >

                    <span
                        class="opponent"
                        style="
                            color:
                                ${
                                    fixture.opponentColor ||
                                    CLUB_COLORS[
                                        fixture.opponent
                                    ] ||
                                    "#ffffff"
                                };
                        "
                    >
                        ${fixture.opponent}
                    </span>

                    <span class="opponent-division">
                        ${fixture.opponentDivision}
                    </span>

                </div>

                <div class="right-side">

                    <span class="pot-label">
                        Pot ${fixture.opponentPot + 1}
                    </span>

                    <span
                        class="
                            location
                            ${
                                fixture.home
                                    ? "home"
                                    : "away"
                            }
                        "
                    >
                        ${
                            fixture.home
                                ? "HOME"
                                : "AWAY"
                        }
                    </span>

                </div>

            `;

            liveFixtures.appendChild(
                fixtureElement
            );

            await new Promise(
                requestAnimationFrame
            );

            const targetPosition =
                fixtureElement.getBoundingClientRect().top +
                window.scrollY -
                100;

            window.scrollTo({

                top:
                    Math.max(
                        0,
                        targetPosition
                    ),

                behavior: "smooth"

            });

            await wait(750);

        }

        await wait(300);

    }


    const status =
        document.getElementById(
            "drawStatus"
        );

    status.classList.remove(
        "active"
    );

    status.classList.add(
        "finished"
    );

    status.textContent =
        "✓ Draw complete";

    await wait(300);


    const info =
        document.createElement(
            "div"
        );

    info.className = "info";

    info.textContent =
        "8 opponents • 2 from each pot • 4 HOME • 4 AWAY";

    result.appendChild(info);

    await new Promise(
        requestAnimationFrame
    );

    window.scrollTo({

        top:
            info.getBoundingClientRect().top +
            window.scrollY - 100,

        behavior: "smooth"

    });

}


/* =========================
   FIXTURES TAB
   ACCORDION
========================= */

function updateFixturesTab() {

    const container =
        document.getElementById(
            "drawnTeams"
        );

    container.innerHTML = "";

    /*
        Nothing is automatically opened.
    */

    activeFixtureTeam = null;


    if (revealedFixtures.size === 0) {

        container.innerHTML = `

            <div class="empty-fixtures">

                No fixtures have been revealed yet.

                <br><br>

                Go to the DRAW tab and draw
                a team first.

            </div>

        `;

        return;

    }


    /*
        Every team with at least one
        revealed fixture becomes an
        accordion item.
    */

    for (
        const [teamId, fixtures]
        of revealedFixtures
    ) {

        if (!fixtures || fixtures.length === 0) {
            continue;
        }

        const team =
            teams.find(
                item =>
                    getTeamId(item) === teamId
            );

        if (!team) {
            continue;
        }


        /*
            MAIN ACCORDION CONTAINER
        */

        const teamElement =
            document.createElement(
                "div"
            );

        teamElement.className =
            "fixture-team";

        teamElement.dataset.teamId =
            teamId;


        /*
            CLICKABLE HEADER
        */

        const header =
            document.createElement(
                "div"
            );

        header.className =
            "fixture-team-header";


        /*
            LOGO
        */

        const logo =
            document.createElement(
                "img"
            );

        logo.className =
            "fixture-team-logo";

        logo.src =
            team.logo;

        logo.alt =
            team.name;

        logo.onerror = function () {

            const fallback =
                document.createElement(
                    "div"
                );

            fallback.className =
                "team-logo-fallback";

            fallback.textContent =
                getInitials(
                    team.name
                );

            this.replaceWith(
                fallback
            );

        };

        header.appendChild(
            logo
        );


        /*
            TEAM NAME
        */

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "fixture-team-name";

        name.textContent =
            team.name;

        name.style.color =
            team.color;

        header.appendChild(
            name
        );


        /*
            FIXTURE COUNT
        */

        const count =
            document.createElement(
                "span"
            );

        count.className =
            "fixture-team-count";

        count.textContent =
            `${fixtures.length} ${
                fixtures.length === 1
                    ? "fixture"
                    : "fixtures"
            }`;

        header.appendChild(
            count
        );


        /*
            ARROW
        */

        const arrow =
            document.createElement(
                "span"
            );

        arrow.className =
            "fixture-team-arrow";

        arrow.textContent =
            "▼";

        header.appendChild(
            arrow
        );


        teamElement.appendChild(
            header
        );


        /*
            FIXTURE DETAILS.

            IMPORTANT:
            These are placed INSIDE the
            team element, directly below
            that team.
        */

        const fixtureDetails =
            document.createElement(
                "div"
            );

        fixtureDetails.className =
            "fixture-team-details";


        fixtures.forEach(
            fixture => {

                const matchCard =
                    createMatchCard(
                        team,
                        fixture
                    );

                fixtureDetails.appendChild(
                    matchCard
                );

            }
        );


        teamElement.appendChild(
            fixtureDetails
        );


        /*
            OPEN / CLOSE
        */

        header.addEventListener(
            "click",
            () => {

                toggleTeamFixtures(
                    team,
                    teamElement
                );

            }
        );


        container.appendChild(
            teamElement
        );

    }

}


/* =========================
   CREATE MATCH CARD
========================= */

function createMatchCard(
    team,
    fixture
) {

    const matchCard =
        document.createElement(
            "div"
        );

    matchCard.className =
        "match-card";


    /*
        SELECTED TEAM
    */

    const teamSide =
        document.createElement(
            "div"
        );

    teamSide.className =
        "match-team " +
        (
            fixture.home
                ? "home-team"
                : "away-team"
        );


    const teamName =
        document.createElement(
            "span"
        );

    teamName.textContent =
        team.name;

    teamName.style.color =
        team.color;


    const teamLogo =
        document.createElement(
            "img"
        );

    teamLogo.src =
        team.logo;

    teamLogo.alt =
        team.name;

    teamLogo.onerror =
        function () {

            this.style.display =
                "none";

        };


    teamSide.appendChild(
        teamName
    );

    teamSide.appendChild(
        teamLogo
    );


    /*
        VS
    */

    const vs =
        document.createElement(
            "span"
        );

    vs.className =
        "vs";

    vs.textContent =
        "VS";


    /*
        OPPONENT
    */

    const opponentSide =
        document.createElement(
            "div"
        );

    opponentSide.className =
        "match-team " +
        (
            fixture.home
                ? "away-team"
                : "home-team"
        );


    const opponentLogo =
        document.createElement(
            "img"
        );

    opponentLogo.src =
        fixture.opponentLogo;

    opponentLogo.alt =
        fixture.opponent;

    opponentLogo.onerror =
        function () {

            const fallback =
                document.createElement(
                    "div"
                );

            fallback.className =
                "team-logo-fallback";

            fallback.textContent =
                getInitials(
                    fixture.opponent
                );

            this.replaceWith(
                fallback
            );

        };


    const opponentName =
        document.createElement(
            "span"
        );

    opponentName.textContent =
        fixture.opponent;

    opponentName.style.color =
        fixture.opponentColor ||
        "#ffffff";


    opponentSide.appendChild(
        opponentLogo
    );

    opponentSide.appendChild(
        opponentName
    );


    /*
        BUILD MATCH
    */

    matchCard.appendChild(
        teamSide
    );

    matchCard.appendChild(
        vs
    );

    matchCard.appendChild(
        opponentSide
    );


    return matchCard;

}


/* =========================
   OPEN / CLOSE TEAM
========================= */

function toggleTeamFixtures(
    team,
    teamElement
) {

    const wasOpen =
        teamElement.classList.contains(
            "open"
        );


    /*
        Close every team first.
    */

    document
        .querySelectorAll(
            ".fixture-team"
        )
        .forEach(element => {

            element.classList.remove(
                "open"
            );

        });


    activeFixtureTeam = null;


    /*
        If the clicked team was closed,
        open it.

        If it was already open,
        leave everything closed.
    */

    if (!wasOpen) {

        teamElement.classList.add(
            "open"
        );

        activeFixtureTeam =
            team;

    }

}


/* =========================
   TAB SWITCHING
========================= */

function switchTab(tab) {

    const drawTab =
        document.getElementById(
            "drawTab"
        );

    const fixturesTab =
        document.getElementById(
            "fixturesTab"
        );

    const drawTabBtn =
        document.getElementById(
            "drawTabBtn"
        );

    const fixturesTabBtn =
        document.getElementById(
            "fixturesTabBtn"
        );


    if (tab === "draw") {

        drawTab.classList.add(
            "active"
        );

        fixturesTab.classList.remove(
            "active"
        );

        drawTabBtn.classList.add(
            "active"
        );

        fixturesTabBtn.classList.remove(
            "active"
        );

    } else {

        drawTab.classList.remove(
            "active"
        );

        fixturesTab.classList.add(
            "active"
        );

        drawTabBtn.classList.remove(
            "active"
        );

        fixturesTabBtn.classList.add(
            "active"
        );


        /*
            Rebuild the accordion.

            Nothing opens automatically.
        */

        updateFixturesTab();

    }

}


/* =========================
   RESET
========================= */

function resetDraw() {

    if (drawInProgress) {
        return;
    }

    teams = [];

    selectedTeam = null;

    drawGenerated = false;

    revealedFixtures.clear();

    activeFixtureTeam = null;


    document
        .querySelectorAll(".team")
        .forEach(element => {

            element.classList.remove(
                "selected"
            );

        });


    const selectedName =
        document.getElementById(
            "selectedName"
        );

    selectedName.textContent =
        "None";

    selectedName.style.color =
        "#ffffff";


    document.getElementById(
        "result"
    ).style.display = "none";


    updateFixturesTab();


    switchTab("draw");


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });


    createTeams();

    buildTeamList();

}


/* =========================
   BUTTON EVENTS
========================= */

document
    .getElementById("drawBtn")
    .addEventListener(
        "click",
        drawSelectedTeam
    );

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        resetDraw
    );


/* =========================
   INITIAL LOAD
========================= */

createTeams();

buildTeamList();

updateFixturesTab();

</script>
